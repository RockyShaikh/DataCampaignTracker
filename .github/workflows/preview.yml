name: PR preview

# Gives every pull request its own live copy of the site, so a reviewer can
# click around the actual change before approving it.
#
# Preview apps are named datacampaigntracker-pr-<number> and are destroyed when
# the PR closes. They have NO volume: /data is container-local and repopulates
# from the Google Sheet on boot. Production data is never reachable from here.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_ORG: personal
  PREVIEW_APP: datacampaigntracker-pr-${{ github.event.pull_request.number }}

jobs:
  deploy-preview:
    name: deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post the preview URL as a comment
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # `fly apps create` errors if the app already exists, which is the normal
      # case on the 2nd+ push to a PR — so tolerate it.
      - name: Create preview app if absent
        run: |
          if flyctl apps list | grep -qw "$PREVIEW_APP"; then
            echo "app $PREVIEW_APP already exists"
          else
            flyctl apps create "$PREVIEW_APP" --org "$FLY_ORG"
          fi

      # Same sheet the production app reads. Read-only from the app's side:
      # sync.js only ever pulls. Set every time so rotated values propagate.
      - name: Set sheet secrets
        run: |
          flyctl secrets set --app "$PREVIEW_APP" --stage \
            SHEET_ID="${{ secrets.SHEET_ID }}" \
            LOG_GID="${{ secrets.LOG_GID }}" \
            MANIFEST_GID="${{ secrets.MANIFEST_GID }}" \
            SYNC_POLL_MIN="5"

      - name: Deploy preview
        run: |
          sed "s/^app = .*/app = '$PREVIEW_APP'/" fly.preview.toml > fly.generated.toml
          flyctl deploy --remote-only --ha=false \
            --app "$PREVIEW_APP" --config fly.generated.toml

      - name: Comment the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${process.env.PREVIEW_APP}.fly.dev`;
            const marker = '<!-- preview-url -->';
            const body = [
              marker,
              `### 🚀 Preview ready`,
              ``,
              `**${url}**`,
              ``,
              `Built from \`${context.sha.slice(0, 7)}\`. Sleeps when idle — first load may take a few seconds to wake.`,
              ``,
              `Log and manifest data pull from the live Google Sheet within ~5 min of boot.`,
              `The building registry is the **shipped default**, so zones and coverage colours`,
              `may differ from production. Destroyed automatically when this PR closes.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  destroy-preview:
    name: destroy preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy preview app
        run: flyctl apps destroy "$PREVIEW_APP" --yes || echo "nothing to destroy"
