name: Claude agent

# The issue-to-PR loop.
#
#   1. Someone files an issue ("the map pins are offset on Buildings tab")
#   2. Someone with write access comments `@claude fix this`
#   3. This workflow checks out main, Claude edits on a branch, opens a PR
#   4. CI builds it; preview.yml deploys it to its own URL
#   5. A human opens the preview, clicks around, approves + merges
#   6. deploy.yml ships it to production
#
# Not happy with the PR? Comment `@claude also handle X` on it and the agent
# pushes another commit. The preview updates in place. Loop until you merge.
#
# Auth uses CLAUDE_CODE_OAUTH_TOKEN — your Claude subscription, not a metered
# API key. Generate it locally with `claude setup-token`.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only people with write access can spend tokens. A drive-by comment from
    # someone with read-only access is ignored. This is the guard that stops a
    # stray @claude from burning your subscription quota.
    if: |
      contains(github.event.comment.author_association, 'OWNER') ||
      contains(github.event.comment.author_association, 'MEMBER') ||
      contains(github.event.comment.author_association, 'COLLABORATOR') ||
      contains(github.event.issue.author_association, 'OWNER') ||
      contains(github.event.issue.author_association, 'MEMBER') ||
      contains(github.event.issue.author_association, 'COLLABORATOR') ||
      contains(github.event.review.author_association, 'OWNER') ||
      contains(github.event.review.author_association, 'MEMBER') ||
      contains(github.event.review.author_association, 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create branches and commits
      pull-requests: write    # open and update PRs
      issues: write           # comment back on the issue
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # agent needs history to branch sensibly

      # Hand the agent a warm node_modules. Without this it has to run
      # `npm install` itself before it can run `npm run ci`, burning turns on
      # setup instead of on the actual change.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model opus
            --max-turns 60
          prompt: |
            You are working on DataCampaignTracker, the CMU WiSELab data
            collection dashboard. Read CLAUDE.md first — it documents the
            architecture, data models, and conventions.

            Ground rules for this repo:

            - NEVER commit anything under data/. That directory is the runtime
              state store and holds real collection data. It is gitignored for
              a reason.
            - NEVER put credentials in the repo. The Strava session cookie and
              the Google Sheet IDs are runtime config (Fly secrets), not code.
            - Before opening a PR, run `npm run ci` (build + smoke test) and
              make sure it passes. If you cannot make it pass, say so in the PR
              description rather than opening a green-looking PR.
            - Production is deployed from main automatically. Assume anything
              you merge reaches real users the same day.
            - Match the surrounding code style: no TypeScript, ES modules,
              Tailwind classes inline, analytics derived via useMemo.

            In your PR description, state plainly what you changed, what you
            verified, and anything you were unsure about. A reviewer will open
            a preview deployment of your branch before approving.
