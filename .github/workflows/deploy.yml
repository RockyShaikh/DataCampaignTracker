name: Deploy to production

# Fires only when something lands on main. Because main is protected, the only
# way to get here is a merged, reviewed, CI-green pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:   # manual "Run workflow" button, for redeploying unchanged code

# Never let two deploys race. Unlike CI, do NOT cancel in progress: aborting
# halfway through a machine rollout is worse than queueing.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    environment: production   # lets you add a required-reviewer gate later
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Builds on Fly's remote builder and does a rolling machine update.
      # The tracker_data volume is NOT touched by a deploy — code only.
      - name: Deploy
        run: flyctl deploy --remote-only --app datacampaigntracker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify the new release answers
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://datacampaigntracker.fly.dev/api/status)
            [ "$code" = "200" ] && echo "✓ production healthy" && exit 0
            sleep 5
          done
          echo "✗ production did not return 200 after deploy"
          exit 1
